<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d0e"><title>VIAANA · MALOKA</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=2"><script defer src="app.js?v=2"></script></head>
<body data-logo="./assets/logo.png">
<section id="lock" class="lock">
  <form id="login" class="panel">
    <div class="brand"><b>V</b> VIAANA</div><h1>ABRE A BASE.</h1><p>Área pessoal de Guilherme Viana.</p>
    <label>Usuário<input name="user" autocomplete="username" required></label>
    <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Entrar</button><p id="login-error" role="alert"></p>
  </form>
</section>
<div id="shell" hidden>
  <aside><a class="brand" href="#inicio"><b>V</b> VIAANA</a><nav id="nav" aria-label="Seções"></nav><button id="logout" class="quiet">Sair</button></aside>
  <main id="main" tabindex="-1">
    <header><span id="today"></span><div class="tools"><button id="logo-settings">Logo</button><button id="notify">Ativar avisos</button><button id="install">Instalar</button></div></header>
    <section id="content"></section><p id="status" role="status"></p>
  </main>
</div>
<dialog id="editor"><form id="entry-form"><h2 id="form-title"></h2><div id="fields"></div><p id="entry-error" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></div></form></dialog>
<dialog id="help"><h2>Instalar o VIAANA</h2><p>Abra o menu do navegador e procure “Instalar app” ou “Adicionar à tela inicial”. No iPhone, use Compartilhar no Safari e toque em “Adicionar à Tela de Início”.</p><form method="dialog"><button class="primary">Fechar</button></form></dialog>
<dialog id="player" aria-labelledby="player-title"><h2 id="player-title"></h2><div id="player-frame"></div><div id="player-fallback"></div><form method="dialog"><button class="primary">Fechar</button></form></dialog>
<dialog id="logo-dialog" aria-labelledby="logo-title"><h2 id="logo-title">Logo do VIAANA</h2><form id="logo-form"><label>Foto do aparelho<input type="file" name="logoFile" accept="image/jpeg,image/png,image/webp,image/avif,image/gif"></label><label>Ou link da imagem<input type="url" name="logoUrl"></label><p id="logo-error" role="alert"></p><div class="actions"><button type="button" id="reset-logo">Restaurar</button><button class="primary" type="submit">Salvar logo</button></div></form><form method="dialog"><button>Cancelar</button></form></dialog>
</body></html>
